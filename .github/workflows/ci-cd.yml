name: FinStream CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build Java Microservices & Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build Maven Parent & Modules
        run: mvn clean install -DskipTests

      - name: Execute Unit & Integration Tests
        run: mvn test

  docker-build-and-push:
    name: Build & Push Docker Container Images
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service: [account-service, ingestion-service, processor-service, fraud-service, analytics-service]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build & Push Image (${{ matrix.service }})
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            finstream/${{ matrix.service }}:latest
            finstream/${{ matrix.service }}:${{ github.sha }}

  k8s-deploy-validation:
    name: Validate Kubernetes Manifests & Dry-Run
    needs: docker-build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install kubectl
        uses: azure/setup-kubectl@v3

      - name: Validate Kubernetes Manifests
        run: |
          kubectl apply --dry-run=client -f k8s/00-namespace.yaml
          kubectl apply --dry-run=client -f k8s/01-postgres.yaml
          kubectl apply --dry-run=client -f k8s/02-redis.yaml
          kubectl apply --dry-run=client -f k8s/03-kafka.yaml
          kubectl apply --dry-run=client -f k8s/04-microservices.yaml
          kubectl apply --dry-run=client -f k8s/05-hpa.yaml
          kubectl apply --dry-run=client -f k8s/06-ingress.yaml
